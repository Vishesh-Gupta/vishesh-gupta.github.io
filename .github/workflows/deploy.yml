name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# Least privilege: deploy-pages needs to write Pages and mint an OIDC token to
# prove the artifact came from this workflow. Nothing here writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Not cancel-in-progress — a half-finished deploy is
# worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: it reads `packageManager` from
      # package.json, so CI uses whatever pnpm wrote the lockfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This runs tsc first, so a type error fails the deploy instead of
      # shipping a broken build.
      - run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
