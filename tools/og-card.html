<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Newsreader';
        font-weight: 400;
        src: url('/fonts/newsreader-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 400 500;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      /* Same tokens as src/index.css — the card is the site, not a poster
         for it. Keep the two in step when the palette changes. */
      body {
        background-color: #03050a;
        background-image: radial-gradient(110% 120% at 20% 30%, #0f0e0d 0%, #07080b 48%, #03050a 100%);
        color: #f4f1ed;
        font-family: 'Newsreader', Georgia, serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }
      .hello {
        font-size: 128px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .rule {
        width: 64px;
        height: 1px;
        background: #322e2a;
        margin: 44px 0 40px;
      }
      .name {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 25px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f4f1ed;
      }
      .name .dot { color: #322e2a; margin: 0 0.5em; }
      .name .role { color: #8d8880; }
      .foot {
        position: absolute;
        left: 96px;
        bottom: 72px;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 20px;
        letter-spacing: 0.06em;
        color: #8d8880;
      }
    </style>
  </head>
  <body>
    <div class="hello">Hello</div>
    <div class="rule"></div>
    <div class="name">Vishesh Gupta <span class="dot">·</span><span class="role">Staff Software Engineer</span></div>
    <div class="foot">vishesh-gupta.github.io</div>
  </body>
</html>
